<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><rect width="1200" height="780" fill="#FFFFFF"/><rect x="565" y="34" width="70" height="5" rx="3" fill="#2563EB"/><text x="600" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="600" dy="0">Chat vs Work vs Codex</tspan></text><text x="600" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="600" dy="0">Choose the environment first, then choose model and reasoning.</tspan></text><rect x="45" y="180" width="330" height="540" rx="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="87" cy="220" r="27" fill="#2563EB"/><text x="87" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="87" dy="0">1</tspan></text><text x="130" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="130" dy="0">Chat</tspan></text><text x="67" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="67" dy="0">Quick questions, brainstorming,</tspan><tspan x="67" dy="26">research, explanations, decisions,</tspan><tspan x="67" dy="26">and prompt preparation.</tspan></text><rect x="63" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="97" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="97" dy="0">Questions</tspan></text><rect x="139" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="173" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="173" dy="0">Ideas</tspan></text><rect x="215" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="249" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="249" dy="0">Research</tspan></text><rect x="291" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="325" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="325" dy="0">Decisions</tspan></text><rect x="63" y="590" width="294" height="105" rx="14" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="79" y="625" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="79" dy="0">Not the natural environment for</tspan><tspan x="79" dy="22">changing a repository or</tspan><tspan x="79" dy="22">running a long technical</tspan><tspan x="79" dy="22">workflow.</tspan></text><rect x="415" y="180" width="330" height="540" rx="20" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="457" cy="220" r="27" fill="#14B8A6"/><text x="457" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="457" dy="0">2</tspan></text><text x="500" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="500" dy="0">Work</tspan></text><text x="437" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="437" dy="0">Long research, multi-document</tspan><tspan x="437" dy="26">analysis, reports, presentations,</tspan><tspan x="437" dy="26">spreadsheets, and finished</tspan><tspan x="437" dy="26">multi-step deliverables.</tspan></text><rect x="433" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="467" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="467" dy="0">Analysis</tspan></text><rect x="509" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="543" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="543" dy="0">Reports</tspan></text><rect x="585" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="619" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="619" dy="0">Sheets</tspan></text><rect x="661" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="695" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="695" dy="0">Multi-step</tspan></text><rect x="433" y="590" width="294" height="105" rx="14" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="449" y="625" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="449" dy="0">Best for dossiers, proposals,</tspan><tspan x="449" dy="22">document-heavy audits, and</tspan><tspan x="449" dy="22">finished outputs.</tspan></text><rect x="785" y="180" width="330" height="540" rx="20" fill="#F5F3FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="827" cy="220" r="27" fill="#2563EB"/><text x="827" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="827" dy="0">3</tspan></text><text x="870" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="870" dy="0">Codex</tspan></text><text x="807" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="807" dy="0">Write and debug code, work with</tspan><tspan x="807" dy="26">repositories, run tests and</tspan><tspan x="807" dy="26">commands, review, patch, refactor,</tspan><tspan x="807" dy="26">and prepare PRs.</tspan></text><rect x="803" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="837" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="837" dy="0">Code</tspan></text><rect x="879" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="913" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="913" dy="0">Repository</tspan></text><rect x="955" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="989" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="989" dy="0">Tests</tspan></text><rect x="1031" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="1065" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="1065" dy="0">PR /</tspan><tspan x="1065" dy="18">review</tspan></text><rect x="803" y="590" width="294" height="105" rx="14" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="819" y="625" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="819" dy="0">Default environment when the</tspan><tspan x="819" dy="22">repository, tests, commands, or</tspan><tspan x="819" dy="22">PR are central.</tspan></text></svg>