<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <rect width="1200" height="780" fill="#FFFFFF"/>
  <rect x="565" y="34" width="70" height="5" rx="3" fill="#2563EB"/>
  <text x="600" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="600" dy="0">Chat vs Work vs Codex</tspan></text>
  <text x="600" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="600" dy="0">Choisis d’abord l’environnement adapté au travail, puis le modèle et le reasoning.</tspan></text>
  <rect x="45" y="180" width="330" height="540" rx="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="87" cy="220" r="27" fill="#2563EB"/><text x="87" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="87" dy="0">1</tspan></text><text x="130" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="130" dy="0">Chat</tspan></text><text x="67" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="67" dy="0">Questions rapides, brainstorming,</tspan><tspan x="67" dy="26">recherche / explications,</tspan><tspan x="67" dy="26">préparation de décisions et prompts.</tspan></text><rect x="63" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="97" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="97" dy="0">Questions</tspan></text><rect x="139" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="173" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="173" dy="0">Idées</tspan></text><rect x="215" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="249" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="249" dy="0">Recherche</tspan></text><rect x="291" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="325" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="325" dy="0">Décisions</tspan></text><rect x="63" y="590" width="294" height="105" rx="14" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="79" y="625" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="79" dy="0">Pas l’environnement naturel</tspan><tspan x="79" dy="22">pour modifier un repo ou</tspan><tspan x="79" dy="22">conduire un workflow technique</tspan><tspan x="79" dy="22">long.</tspan></text><rect x="415" y="180" width="330" height="540" rx="20" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="457" cy="220" r="27" fill="#14B8A6"/><text x="457" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="457" dy="0">2</tspan></text><text x="500" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="500" dy="0">Work</tspan></text><text x="437" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="437" dy="0">Recherche longue, analyse</tspan><tspan x="437" dy="26">multi-documents, rapports,</tspan><tspan x="437" dy="26">présentations, feuilles et travail</tspan><tspan x="437" dy="26">multi-étapes avec livrable final.</tspan></text><rect x="433" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="467" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="467" dy="0">Analyse</tspan></text><rect x="509" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="543" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="543" dy="0">Rapports</tspan></text><rect x="585" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="619" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="619" dy="0">Feuilles</tspan></text><rect x="661" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="695" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="695" dy="0">Multi-étapes</tspan></text><rect x="433" y="590" width="294" height="105" rx="14" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="449" y="625" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="449" dy="0">Idéal pour dossiers, AO, audits</tspan><tspan x="449" dy="22">documentaires et livrables</tspan><tspan x="449" dy="22">finis.</tspan></text><rect x="785" y="180" width="330" height="540" rx="20" fill="#F5F3FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="827" cy="220" r="27" fill="#2563EB"/><text x="827" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="827" dy="0">3</tspan></text><text x="870" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="870" dy="0">Codex</tspan></text><text x="807" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="807" dy="0">Écrire / débugger du code,</tspan><tspan x="807" dy="26">travailler sur un repository,</tspan><tspan x="807" dy="26">exécuter tests et commandes, review,</tspan><tspan x="807" dy="26">patch, PR et refactoring.</tspan></text><rect x="803" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="837" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="837" dy="0">Code</tspan></text><rect x="879" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="913" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="913" dy="0">Repository</tspan></text><rect x="955" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="989" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="989" dy="0">Tests</tspan></text><rect x="1031" y="470" width="68" height="90" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="1065" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="1065" dy="0">PR /</tspan><tspan x="1065" dy="18">review</tspan></text><rect x="803" y="590" width="294" height="105" rx="14" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="819" y="625" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="819" dy="0">Environnement par défaut dès</tspan><tspan x="819" dy="22">que le repo, les tests ou la PR</tspan><tspan x="819" dy="22">sont au centre.</tspan></text></svg>