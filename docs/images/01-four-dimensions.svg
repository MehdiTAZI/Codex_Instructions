<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><rect x="565" y="34" width="70" height="5" rx="3" fill="#2563EB"/><text x="600" y="90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="600" dy="0">Four independent choices</tspan></text><text x="600" y="128" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="600" dy="0">Model, reasoning, surface, and orchestration solve different problems.</tspan></text><rect x="45" y="185" width="255" height="440" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="81" cy="222" r="24" fill="#2563EB"/><text x="81" y="229" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="81" dy="0">1</tspan></text><text x="117" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="117" dy="0">1. Model</tspan></text><text x="65" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="65" dy="0">Base capability</tspan></text><text x="65" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#2563EB" text-anchor="start"><tspan x="65" dy="0">Luna → 6.1 Sol → Astra</tspan></text><rect x="63" y="500" width="219" height="88" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="79" y="535" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="79" dy="0">Choose capability for the workload.</tspan></text><rect x="330" y="185" width="255" height="440" rx="18" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="366" cy="222" r="24" fill="#14B8A6"/><text x="366" y="229" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="366" dy="0">2</tspan></text><text x="402" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="402" dy="0">2. Reasoning</tspan></text><text x="350" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="350" dy="0">Thinking budget</tspan></text><text x="350" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#14B8A6" text-anchor="start"><tspan x="350" dy="0">Low → Medium → High → XHigh → Max</tspan></text><rect x="348" y="500" width="219" height="88" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="364" y="535" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="364" dy="0">Increase only when it adds value.</tspan></text><rect x="615" y="185" width="255" height="440" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><circle cx="651" cy="222" r="24" fill="#7C3AED"/><text x="651" y="229" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="651" dy="0">3</tspan></text><text x="687" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="687" dy="0">3. Surface</tspan></text><text x="635" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="635" dy="0">Available tools / workflow</tspan></text><text x="635" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#7C3AED" text-anchor="start"><tspan x="635" dy="0">Chat • Work • Codex</tspan></text><rect x="633" y="500" width="219" height="88" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="649" y="535" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="649" dy="0">Repo at the center? Use Codex.</tspan></text><rect x="900" y="185" width="255" height="440" rx="18" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="936" cy="222" r="24" fill="#14B8A6"/><text x="936" y="229" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="936" dy="0">4</tspan></text><text x="972" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="972" dy="0">4. Orchestration</tspan></text><text x="920" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="920" dy="0">Execution topology</tspan></text><text x="920" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#14B8A6" text-anchor="start"><tspan x="920" dy="0">Single-agent • Multi-agent</tspan></text><rect x="918" y="500" width="219" height="88" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="934" y="535" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="934" dy="0">Parallelize only independent work.</tspan></text><rect x="45" y="660" width="1110" height="70" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="600" y="700" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="600" dy="0">The four choices are independent. Do not solve every problem by selecting</tspan><tspan x="600" dy="23">the biggest model at the highest reasoning level.</tspan></text></svg>