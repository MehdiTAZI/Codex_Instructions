  <text x="600" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="600" dy="0">Le bon choix se fait sur 4 dimensions</tspan></text>
  <text x="600" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="600" dy="0">Ne mélange pas modèle, reasoning, surface et orchestration.</tspan></text>
  <rect x="30" y="175" width="265" height="530" rx="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="68" cy="215" r="27" fill="#2563EB"/><text x="68" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="68" dy="0">1</tspan></text><text x="106" y="224" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="106" dy="0">Modèle</tspan></text><text x="50" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="50" dy="0">Détermine le niveau de</tspan><tspan x="50" dy="23">capacité de base.</tspan></text><rect x="325" y="175" width="265" height="530" rx="20" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="363" cy="215" r="27" fill="#14B8A6"/><text x="363" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="363" dy="0">2</tspan></text><text x="401" y="224" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="401" dy="0">Reasoning</tspan></text><text x="345" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="345" dy="0">Détermine combien le modèle</tspan><tspan x="345" dy="23">travaille sur le problème.</tspan></text><rect x="620" y="175" width="265" height="530" rx="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="658" cy="215" r="27" fill="#2563EB"/><text x="658" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="658" dy="0">3</tspan></text><text x="696" y="224" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="696" dy="0">Surface</tspan></text><text x="640" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="640" dy="0">Détermine les outils et le</tspan><tspan x="640" dy="23">workflow disponibles.</tspan></text><rect x="915" y="175" width="265" height="530" rx="20" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="953" cy="215" r="27" fill="#14B8A6"/><text x="953" y="223" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="953" dy="0">4</tspan></text><text x="991" y="224" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="991" dy="0">Orchestration</tspan></text><text x="935" y="275" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="935" dy="0">Single-agent pour un</tspan><tspan x="935" dy="23">problème cohérent.</tspan><tspan x="935" dy="23">Multi-agent si les</tspan><tspan x="935" dy="23">workstreams sont</tspan><tspan x="935" dy="23">indépendants.</tspan></text><text x="162" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="162" dy="0">Luna  →  GPT-6 Sol</tspan><tspan x="162" dy="23">→  GPT-6.1 Sol  →  Astra</tspan></text><text x="162" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="162" dy="0">volume/coût • ancien Sol</tspan><tspan x="162" dy="19">workhorse • capacité max</tspan></text><rect x="343" y="395" width="43" height="34" rx="17" fill="#EFF6FF"/><text x="364.5" y="418" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="364.5" dy="0">Low</tspan></text><rect x="390" y="395" width="43" height="34" rx="17" fill="#EFF6FF"/><text x="411.5" y="418" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="411.5" dy="0">Medium</tspan></text><rect x="437" y="395" width="43" height="34" rx="17" fill="#EFF6FF"/><text x="458.5" y="418" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="458.5" dy="0">High</tspan></text><rect x="484" y="395" width="43" height="34" rx="17" fill="#EFF6FF"/><text x="505.5" y="418" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="505.5" dy="0">XHigh</tspan></text><rect x="531" y="395" width="43" height="34" rx="17" fill="#EFF6FF"/><text x="552.5" y="418" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="552.5" dy="0">Max</tspan></text><text x="457" y="475" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="457" dy="0">Ultra = choix produit Work/Codex</tspan><tspan x="457" dy="19">au-dessus de Max.</tspan></text><rect x="645" y="390" width="68" height="100" rx="20" fill="#EFF6FF" stroke="none" stroke-width="1.5"/><text x="679" y="448" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="679" dy="0">Chat</tspan></text><rect x="723" y="390" width="68" height="100" rx="20" fill="#ECFDF5" stroke="none" stroke-width="1.5"/><text x="757" y="448" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="757" dy="0">Work</tspan></text><rect x="801" y="390" width="68" height="100" rx="20" fill="#EFF6FF" stroke="none" stroke-width="1.5"/><text x="835" y="448" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="835" dy="0">Codex</tspan></text><text x="752" y="525" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="752" dy="0">conversation</tspan><tspan x="752" dy="18">livrables</tspan><tspan x="752" dy="18">repo / tests</tspan></text><circle cx="975" cy="425" r="42" fill="#EFF6FF"/><text x="975" y="434" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#2563EB" text-anchor="middle"><tspan x="975" dy="0">1</tspan></text><line x1="1025" y1="425" x2="1080" y2="390" stroke="#14B8A6" stroke-width="3"/><path d="M 1070 383 L 1080 390 L 1070 397" fill="none" stroke="#14B8A6" stroke-width="3"/><circle cx="1080" cy="390" r="26" fill="#ECFDF5"/><text x="1080" y="397" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#14B8A6" text-anchor="middle"><tspan x="1080" dy="0">A</tspan></text><circle cx="1130" cy="435" r="26" fill="#ECFDF5"/><text x="1130" y="442" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#14B8A6" text-anchor="middle"><tspan x="1130" dy="0">B</tspan></text><circle cx="1085" cy="480" r="26" fill="#ECFDF5"/><text x="1085" y="487" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#14B8A6" text-anchor="middle"><tspan x="1085" dy="0">C</tspan></text><text x="1048" y="540" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="1048" dy="0">Single-agent</tspan><tspan x="1048" dy="21">vs multi-agent</tspan></text><rect x="35" y="725" width="1130" height="50" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="600" y="756" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="600" dy="0">API : reasoning.effort plafonné à max ; orchestration</tspan><tspan x="600" dy="21">multi-agent séparée.</tspan></text></svg>