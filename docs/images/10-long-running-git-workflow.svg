<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><rect x="565" y="34" width="70" height="5" rx="3" fill="#2563EB"/><text x="600" y="90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="600" dy="0">Long-running Git/GitHub workflow</tspan></text><text x="600" y="128" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="600" dy="0">Make the work recoverable without depending on the original conversation.</tspan></text><rect x="45" y="195" width="210" height="220" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="79" cy="230" r="24" fill="#2563EB"/><text x="79" y="237" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="79" dy="0">1</tspan></text><text x="117" y="238" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="117" dy="0">Issue</tspan></text><text x="63" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="63" dy="0">WHY / WHAT / constraints</tspan><tspan x="63" dy="23">acceptance criteria / DoD</tspan></text><line x1="255" y1="305" x2="270" y2="305" stroke="#2563EB" stroke-width="3"/><path d="M261,298 L270,305 L261,312" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="270" y="195" width="210" height="220" rx="18" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="304" cy="230" r="24" fill="#14B8A6"/><text x="304" y="237" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="304" dy="0">2</tspan></text><text x="342" y="238" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="342" dy="0">Branch / worktree</tspan></text><text x="288" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="288" dy="0">one primary intention</tspan><tspan x="288" dy="23">isolated state</tspan></text><line x1="480" y1="305" x2="495" y2="305" stroke="#2563EB" stroke-width="3"/><path d="M486,298 L495,305 L486,312" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="495" y="195" width="210" height="220" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="529" cy="230" r="24" fill="#2563EB"/><text x="529" y="237" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="529" dy="0">3</tspan></text><text x="567" y="238" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="567" dy="0">Incremental work</tspan></text><text x="513" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="513" dy="0">small checkpoints</tspan><tspan x="513" dy="23">tests as you go</tspan></text><line x1="705" y1="305" x2="720" y2="305" stroke="#2563EB" stroke-width="3"/><path d="M711,298 L720,305 L711,312" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="720" y="195" width="210" height="220" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><circle cx="754" cy="230" r="24" fill="#7C3AED"/><text x="754" y="237" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="754" dy="0">4</tspan></text><text x="792" y="238" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="792" dy="0">Linked PR</tspan></text><text x="738" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="738" dy="0">HOW / changes / evidence</tspan><tspan x="738" dy="23">reviews / limitations</tspan></text><line x1="930" y1="305" x2="945" y2="305" stroke="#2563EB" stroke-width="3"/><path d="M936,298 L945,305 L936,312" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="945" y="195" width="210" height="220" rx="18" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="979" cy="230" r="24" fill="#14B8A6"/><text x="979" y="237" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="979" dy="0">5</tspan></text><text x="1017" y="238" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="1017" dy="0">Merge + close</tspan></text><text x="963" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="963" dy="0">gates pass</tspan><tspan x="963" dy="23">DoD satisfied</tspan></text><rect x="45" y="455" width="1110" height="190" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="70" y="495" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#2563EB" text-anchor="start"><tspan x="70" dy="0">Resume after interruption</tspan></text><rect x="70" y="530" width="190" height="70" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="165" y="550" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="165">1. Read issue</tspan><tspan x="165" dy="18">+ dependencies</tspan></text><rect x="283" y="530" width="190" height="70" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="378" y="550" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="378">2. Inspect linked PR</tspan><tspan x="378" dy="18">/ reviews</tspan></text><rect x="496" y="530" width="190" height="70" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="591" y="550" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="591">3. Run git status</tspan><tspan x="591" dy="18">+ git diff</tspan></text><rect x="709" y="530" width="190" height="70" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="804" y="550" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="804">4. Check branch history</tspan><tspan x="804" dy="18">+ tests</tspan></text><rect x="922" y="530" width="190" height="70" rx="10" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="1017" y="550" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="1017">5. Continue only</tspan><tspan x="1017" dy="18">remaining work</tspan></text><text x="600" y="625" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#DC2626" text-anchor="middle"><tspan x="600" dy="0">Do not redo completed work. If durable context is missing, update the issue/PR/docs</tspan><tspan x="600" dy="21">before continuing.</tspan></text><rect x="45" y="680" width="1110" height="50" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="600" y="711" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#D97706" text-anchor="middle"><tspan x="600" dy="0">TASK_STATE.md is deprecated by default. GitHub issue + PR + Git/repository state</tspan><tspan x="600" dy="21">are the recovery mechanism.</tspan></text></svg>