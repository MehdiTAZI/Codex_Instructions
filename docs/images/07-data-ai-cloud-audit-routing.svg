<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770"><rect width="1200" height="770" fill="#fff"/><rect x="565" y="34" width="70" height="5" rx="3" fill="#2563EB"/><text x="600" y="90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="600" dy="0">Data/AI, Cloud, architecture &amp; audit routing</tspan></text><text x="600" y="128" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="600" dy="0">Use different configurations for different failure modes—not one model for everything.</tspan></text><rect x="55" y="190" width="1090" height="75" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="90" cy="228" r="24" fill="#2563EB"/><text x="90" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="90" dy="0">1</tspan></text><text x="135" y="221" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="135" dy="0">Data/AI or Cloud architecture</tspan></text><text x="135" y="247" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="135" dy="0">Default balance for architecture and platform engineering.</tspan></text><rect x="855" y="205" width="260" height="45" rx="10" fill="#FFFFFFCC" stroke="none" stroke-width="1.5"/><text x="985" y="234" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#2563EB" text-anchor="middle"><tspan x="985" dy="0">GPT-6.1 Sol High</tspan></text><rect x="55" y="285" width="1090" height="75" rx="14" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="90" cy="323" r="24" fill="#14B8A6"/><text x="90" y="330" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="90" dy="0">2</tspan></text><text x="135" y="316" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="135" dy="0">Ambiguous strategic trade-off</tspan></text><text x="135" y="342" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="135" dy="0">Use when constraints conflict or the decision is structurally important.</tspan></text><rect x="855" y="300" width="260" height="45" rx="10" fill="#FFFFFFCC" stroke="none" stroke-width="1.5"/><text x="985" y="329" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#14B8A6" text-anchor="middle"><tspan x="985" dy="0">GPT-6 Astra High</tspan></text><rect x="55" y="380" width="1090" height="75" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><circle cx="90" cy="418" r="24" fill="#7C3AED"/><text x="90" y="425" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="90" dy="0">3</tspan></text><text x="135" y="411" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="135" dy="0">Code + documentation audit — first pass</tspan></text><text x="135" y="437" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="135" dy="0">Detailed local review and high omission sensitivity.</tspan></text><rect x="855" y="395" width="260" height="45" rx="10" fill="#FFFFFFCC" stroke="none" stroke-width="1.5"/><text x="985" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#7C3AED" text-anchor="middle"><tspan x="985" dy="0">GPT-6.1 Sol Max</tspan></text><rect x="55" y="475" width="1090" height="75" rx="14" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="90" cy="513" r="24" fill="#14B8A6"/><text x="90" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="90" dy="0">4</tspan></text><text x="135" y="506" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="135" dy="0">Cross-cutting / final audit</tspan></text><text x="135" y="532" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="135" dy="0">Use only when independent review axes benefit from parallel agents.</tspan></text><rect x="855" y="490" width="260" height="45" rx="10" fill="#FFFFFFCC" stroke="none" stroke-width="1.5"/><text x="985" y="519" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#14B8A6" text-anchor="middle"><tspan x="985" dy="0">GPT-6 Astra Ultra</tspan></text><rect x="55" y="570" width="1090" height="75" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="90" cy="608" r="24" fill="#2563EB"/><text x="90" y="615" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="90" dy="0">5</tspan></text><text x="135" y="601" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="135" dy="0">Mass extraction / inventory</tspan></text><text x="135" y="627" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="135" dy="0">High volume, low complexity per item.</tspan></text><rect x="855" y="585" width="260" height="45" rx="10" fill="#FFFFFFCC" stroke="none" stroke-width="1.5"/><text x="985" y="614" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="#2563EB" text-anchor="middle"><tspan x="985" dy="0">GPT-6 Luna</tspan></text><rect x="55" y="680" width="1090" height="58" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="600" y="715" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="600" dy="0">High-stakes audit pattern: 1) 6.1 Sol Max → 2) Astra High → 3) Astra Ultra when parallelism adds value.</tspan></text></svg>