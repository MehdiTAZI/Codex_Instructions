<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><rect width="1200" height="740" fill="#fff"/><rect x="565" y="34" width="70" height="5" rx="3" fill="#2563EB"/><text x="600" y="90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="600" dy="0">Git workflow, merge gates &amp; evidence</tspan></text><text x="600" y="128" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="600" dy="0">Keep the workflow readable: execution, merge readiness, and proof are separate concerns.</tspan></text><rect x="40" y="175" width="1120" height="190" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="70" y="215" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#2563EB" text-anchor="start"><tspan x="70" dy="0">1. Delivery flow</tspan></text><rect x="62" y="255" width="112" height="65" rx="12" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="118" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="118" dy="0">Issue</tspan></text><line x1="174" y1="287" x2="194" y2="287" stroke="#2563EB" stroke-width="3"/><path d="M185,280 L194,287 L185,294" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="199" y="255" width="112" height="65" rx="12" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="255" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="255" dy="0">Branch</tspan></text><line x1="311" y1="287" x2="331" y2="287" stroke="#2563EB" stroke-width="3"/><path d="M322,280 L331,287 L322,294" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="336" y="255" width="112" height="65" rx="12" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="392" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="392" dy="0">Implement</tspan></text><line x1="448" y1="287" x2="468" y2="287" stroke="#2563EB" stroke-width="3"/><path d="M459,280 L468,287 L459,294" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="473" y="255" width="112" height="65" rx="12" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="529" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="529" dy="0">Validate</tspan></text><line x1="585" y1="287" x2="605" y2="287" stroke="#2563EB" stroke-width="3"/><path d="M596,280 L605,287 L596,294" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="610" y="255" width="112" height="65" rx="12" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="666" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="666" dy="0">PR</tspan></text><line x1="722" y1="287" x2="742" y2="287" stroke="#2563EB" stroke-width="3"/><path d="M733,280 L742,287 L733,294" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="747" y="255" width="112" height="65" rx="12" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="803" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="803" dy="0">Review</tspan></text><line x1="859" y1="287" x2="879" y2="287" stroke="#2563EB" stroke-width="3"/><path d="M870,280 L879,287 L870,294" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="884" y="255" width="112" height="65" rx="12" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="940" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="940" dy="0">Merge</tspan></text><line x1="996" y1="287" x2="1016" y2="287" stroke="#2563EB" stroke-width="3"/><path d="M1007,280 L1016,287 L1007,294" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="1021" y="255" width="112" height="65" rx="12" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="1077" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="1077" dy="0">Close</tspan></text><text x="70" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#2563EB" text-anchor="start"><tspan x="70" dy="0">One issue = one distinct task • no significant direct work on main • isolate independent workstreams.</tspan></text><rect x="40" y="395" width="535" height="300" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="70" y="435" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#14B8A6" text-anchor="start"><tspan x="70" dy="0">2. Merge gates</tspan></text><circle cx="72" cy="480" r="9" fill="#14B8A6"/><text x="72" y="484" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="72" dy="0">✓</tspan></text><text x="90" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="90" dy="0">out of draft</tspan></text><circle cx="72" cy="523" r="9" fill="#14B8A6"/><text x="72" y="527" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="72" dy="0">✓</tspan></text><text x="90" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="90" dy="0">branch reconciled with main</tspan></text><circle cx="72" cy="566" r="9" fill="#14B8A6"/><text x="72" y="570" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="72" dy="0">✓</tspan></text><text x="90" y="571" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="90" dy="0">build / lint / typecheck</tspan></text><circle cx="72" cy="609" r="9" fill="#14B8A6"/><text x="72" y="613" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="72" dy="0">✓</tspan></text><text x="90" y="614" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="90" dy="0">unit + integration tests</tspan></text><circle cx="317" cy="480" r="9" fill="#14B8A6"/><text x="317" y="484" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="317" dy="0">✓</tspan></text><text x="335" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="335" dy="0">E2E / smoke when cross-system</tspan></text><circle cx="317" cy="523" r="9" fill="#14B8A6"/><text x="317" y="527" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="317" dy="0">✓</tspan></text><text x="335" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="335" dy="0">migration / data compatibility</tspan></text><circle cx="317" cy="566" r="9" fill="#14B8A6"/><text x="317" y="570" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="317" dy="0">✓</tspan></text><text x="335" y="571" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="335" dy="0">security / secret checks</tspan></text><circle cx="317" cy="609" r="9" fill="#14B8A6"/><text x="317" y="613" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="317" dy="0">✓</tspan></text><text x="335" y="614" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start"><tspan x="335" dy="0">diff + docs/spec review</tspan></text><rect x="65" y="650" width="485" height="28" rx="8" fill="#FEF2F2" stroke="none" stroke-width="1.5"/><text x="308" y="670" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#DC2626" text-anchor="middle"><tspan x="308" dy="0">Unresolved mandatory security finding = no merge.</tspan></text><rect x="600" y="395" width="560" height="300" rx="18" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><text x="630" y="435" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#7C3AED" text-anchor="start"><tspan x="630" dy="0">3. Evidence ladder</tspan></text><rect x="650" y="485" width="360" height="24" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="830" y="502" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="830" dy="0">1. Static review</tspan></text><rect x="664" y="516" width="332" height="24" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="830" y="533" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="830" dy="0">2. Local validation</tspan></text><rect x="678" y="547" width="304" height="24" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="830" y="564" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="830" dy="0">3. Plan / dry-run</tspan></text><rect x="692" y="578" width="276" height="24" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="830" y="595" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="830" dy="0">4. Integration</tspan></text><rect x="706" y="609" width="248" height="24" rx="6" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><text x="830" y="626" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="830" dy="0">5. Real deployment</tspan></text><rect x="720" y="640" width="220" height="24" rx="6" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><text x="830" y="657" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="830" dy="0">6. Operational proof</tspan></text><text x="880" y="675" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="880" dy="0">A green CI run proves only the checks that ran.</tspan><tspan x="880" dy="19">Always match the claim to the evidence.</tspan></text></svg>