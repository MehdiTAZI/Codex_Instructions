oe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="513" dy="0">Multi-file refactor</tspan></text><text x="513" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#2563EB" text-anchor="start"><tspan x="513" dy="0">6.1 Sol</tspan></text><text x="513" y="440" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="513" dy="0">High → Max</tspan></text><text x="513" y="515" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="513" dy="0">More coherence</tspan></text><line x1="705" y1="400" x2="720" y2="400" stroke="#2563EB" stroke-width="3"/><path d="M711,393 L720,400 L711,407" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="720" y="205" width="210" height="390" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><circle cx="753" cy="240" r="24" fill="#7C3AED"/><text x="753" y="247" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="753" dy="0">4</tspan></text><text x="790" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="790" dy="0">Hard problem</tspan></text><text x="738" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="738" dy="0">Non-local debug</tspan></text><text x="738" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#7C3AED" text-anchor="start"><tspan x="738" dy="0">6.1 Sol</tspan></text><text x="738" y="440" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="738" dy="0">Max</tspan></text><text x="738" y="515" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="738" dy="0">Explore / verify deeply</tspan></text><line x1="930" y1="400" x2="945" y2="400" stroke="#2563EB" stroke-width="3"/><path d="M936,393 L945,400 L936,407" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="945" y="205" width="210" height="390" rx="18" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="978" cy="240" r="24" fill="#14B8A6"/><text x="978" y="247" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="978" dy="0">5</tspan></text><text x="1015" y="248" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="1015" dy="0">Critical work</tspan></text><text x="963" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="963" dy="0">Architecture / security</tspan></text><text x="963" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#14B8A6" text-anchor="start"><tspan x="963" dy="0">Astra</tspan></text><text x="963" y="440" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start"><tspan x="963" dy="0">High → Max</tspan></text><text x="963" y="515" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="963" dy="0">Quality-first</tspan></text><rect x="45" y="635" width="1110" height="72" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="600" y="675" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="600" dy="0">Large repo + independent workstreams → consider Ultra only when</tspan><tspan x="600" dy="23">parallelism is genuinely useful.</tspan></text></svg>