  <text x="600" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="600" dy="0">Hiérarchie pratique : Luna → GPT-6.1 Sol → Astra. GPT-6 Sol reste surtout utile pour continuité</tspan><tspan x="600" dy="28">/ compatibilité.</tspan></text>
  <rect x="30" y="175" width="270" height="520" rx="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="72" cy="220" r="28" fill="#2563EB"/><text x="72" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="72" dy="0">L</tspan></text><text x="110" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="110" dy="0">GPT-6 Luna</tspan></text><rect x="50" y="270" width="230" height="34" rx="17" fill="#EFF6FF"/><text x="165" y="293" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="165" dy="0">VOLUME / COÛT</tspan></text><text x="50" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="50" dy="0">Le plus efficient pour les</tspan><tspan x="50" dy="23">tâches focalisées et</tspan><tspan x="50" dy="23">répétitives à gros volume.</tspan><tspan x="50" dy="23">Extraction, classification,</tspan><tspan x="50" dy="23">transformations simples.</tspan></text><rect x="48" y="610" width="234" height="58" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="165" y="645" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="165" dy="0">API : $0,10 input / $0,50</tspan><tspan x="165" dy="20">output</tspan></text><rect x="320" y="175" width="270" height="520" rx="20" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="362" cy="220" r="28" fill="#14B8A6"/><text x="362" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="362" dy="0">6</tspan></text><text x="400" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="400" dy="0">GPT-6 Sol</tspan></text><rect x="340" y="270" width="230" height="34" rx="17" fill="#ECFDF5"/><text x="455" y="293" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#14B8A6" text-anchor="middle"><tspan x="455" dy="0">ANCIEN SOL</tspan></text><text x="340" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="340" dy="0">Toujours capable, mais</tspan><tspan x="340" dy="23">surtout utile pour continuité</tspan><tspan x="340" dy="23">de benchmark ou</tspan><tspan x="340" dy="23">compatibilité.</tspan></text><rect x="338" y="610" width="234" height="58" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="455" y="645" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="455" dy="0">Tarif standard : $2 / $10</tspan></text><rect x="610" y="175" width="270" height="520" rx="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="652" cy="220" r="28" fill="#2563EB"/><text x="652" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="652" dy="0">6</tspan></text><text x="690" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="690" dy="0">GPT-6.1 Sol</tspan></text><rect x="630" y="270" width="230" height="34" rx="17" fill="#EFF6FF"/><text x="745" y="293" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="745" dy="0">DEFAULT PRO</tspan></text><text x="630" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="630" dy="0">Near-Astra pour coding</tspan><tspan x="630" dy="23">complexe, computer use et</tspan><tspan x="630" dy="23">travail professionnel. Choix</tspan><tspan x="630" dy="23">par défaut pour la majorité</tspan><tspan x="630" dy="23">des tâches sérieuses.</tspan></text><rect x="628" y="610" width="234" height="58" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="745" y="645" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="745" dy="0">API : $2 / $10</tspan></text><rect x="900" y="175" width="270" height="520" rx="20" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="942" cy="220" r="28" fill="#14B8A6"/><text x="942" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="942" dy="0">✦</tspan></text><text x="980" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="980" dy="0">GPT-6 Astra</tspan></text><rect x="920" y="270" width="230" height="34" rx="17" fill="#ECFDF5"/><text x="1035" y="293" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#14B8A6" text-anchor="middle"><tspan x="1035" dy="0">MAX CAPABILITY</tspan></text><text x="920" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="920" dy="0">Modèle le plus capable pour</tspan><tspan x="920" dy="23">reasoning, coding, research,</tspan><tspan x="920" dy="23">computer use et documents. À</tspan><tspan x="920" dy="23">réserver aux enjeux qui</tspan><tspan x="920" dy="23">justifient le surcoût.</tspan></text><rect x="918" y="610" width="234" height="58" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="1035" y="645" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="1035" dy="0">API : $10 / $50</tspan></text><rect x="30" y="715" width="1140" height="50" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="600" y="747" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="600" dy="0">Lecture pratique : Astra ≈ 5× le coût/token de GPT-6.1 Sol en standard ; escalade seulement si le gain attendu</tspan><tspan x="600" dy="20">est utile.</tspan></text></svg>