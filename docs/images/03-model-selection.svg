<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790"><rect width="1200" height="790" fill="#FFFFFF"/><rect x="565" y="34" width="70" height="5" rx="3" fill="#2563EB"/><text x="600" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" fill="#0F172A" text-anchor="middle"><tspan x="600" dy="0">Which model should you use?</tspan></text><text x="600" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="600" dy="0">Practical hierarchy: Luna → GPT-6.1 Sol → Astra. GPT-6 Sol mainly serves continuity and</tspan><tspan x="600" dy="28">compatibility.</tspan></text><rect x="30" y="175" width="270" height="520" rx="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="72" cy="220" r="28" fill="#2563EB"/><text x="72" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="72" dy="0">L</tspan></text><text x="110" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="110" dy="0">GPT-6 Luna</tspan></text><rect x="50" y="270" width="230" height="34" rx="17" fill="#EFF6FF"/><text x="165" y="293" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="165" dy="0">VOLUME / COST</tspan></text><text x="50" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="50" dy="0">Most efficient for focused,</tspan><tspan x="50" dy="23">repetitive, high-volume work.</tspan><tspan x="50" dy="23">Use for extraction,</tspan><tspan x="50" dy="23">classification, and simple</tspan><tspan x="50" dy="23">transformations.</tspan></text><rect x="48" y="610" width="234" height="58" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="165" y="645" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="165" dy="0">API: $0.10 input / $0.50</tspan><tspan x="165" dy="20">output</tspan></text><rect x="320" y="175" width="270" height="520" rx="20" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="362" cy="220" r="28" fill="#14B8A6"/><text x="362" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="362" dy="0">6</tspan></text><text x="400" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="400" dy="0">GPT-6 Sol</tspan></text><rect x="340" y="270" width="230" height="34" rx="17" fill="#ECFDF5"/><text x="455" y="293" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#14B8A6" text-anchor="middle"><tspan x="455" dy="0">PREVIOUS SOL</tspan></text><text x="340" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="340" dy="0">Still capable, but mainly</tspan><tspan x="340" dy="23">useful for benchmark</tspan><tspan x="340" dy="23">continuity, compatibility, or</tspan><tspan x="340" dy="23">controlled migration.</tspan></text><rect x="338" y="610" width="234" height="58" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="455" y="645" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="455" dy="0">Standard price: $2 / $10</tspan></text><rect x="610" y="175" width="270" height="520" rx="20" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><circle cx="652" cy="220" r="28" fill="#2563EB"/><text x="652" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="652" dy="0">6</tspan></text><text x="690" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="690" dy="0">GPT-6.1 Sol</tspan></text><rect x="630" y="270" width="230" height="34" rx="17" fill="#EFF6FF"/><text x="745" y="293" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle"><tspan x="745" dy="0">DEFAULT PRO</tspan></text><text x="630" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="630" dy="0">Near-Astra performance for</tspan><tspan x="630" dy="23">complex coding, computer use,</tspan><tspan x="630" dy="23">and professional work at</tspan><tspan x="630" dy="23">lower cost. Practical default</tspan><tspan x="630" dy="23">for serious work.</tspan></text><rect x="628" y="610" width="234" height="58" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="745" y="645" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="745" dy="0">API: $2 / $10</tspan></text><rect x="900" y="175" width="270" height="520" rx="20" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5"/><circle cx="942" cy="220" r="28" fill="#14B8A6"/><text x="942" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="942" dy="0">A</tspan></text><text x="980" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start"><tspan x="980" dy="0">GPT-6 Astra</tspan></text><rect x="920" y="270" width="230" height="34" rx="17" fill="#ECFDF5"/><text x="1035" y="293" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#14B8A6" text-anchor="middle"><tspan x="1035" dy="0">MAX CAPABILITY</tspan></text><text x="920" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="920" dy="0">Highest capability for</tspan><tspan x="920" dy="23">demanding reasoning, coding,</tspan><tspan x="920" dy="23">research, computer use, and</tspan><tspan x="920" dy="23">high-stakes work.</tspan></text><rect x="918" y="610" width="234" height="58" rx="12" fill="#FFFFFFAA" stroke="none" stroke-width="1.5"/><text x="1035" y="645" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle"><tspan x="1035" dy="0">API: $10 / $50</tspan></text><rect x="30" y="715" width="1140" height="50" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="600" y="747" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle"><tspan x="600" dy="0">Practical reading: Astra costs about 5x more per token than GPT-6.1 Sol</tspan><tspan x="600" dy="21">at standard API pricing.</tspan></text></svg>